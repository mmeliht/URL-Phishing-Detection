<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>URL Phishing Koruması</title>
<style>
  :root {
    --ink: #1a1f24;
    --paper: #f7f5f1;
    --safe: #1e7a4c;
    --safe-bg: #e8f5ee;
    --danger: #b71c1c;
    --danger-bg: #fbe9e7;
    --neutral: #6b7280;
    --line: #e2dfd8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    width: 320px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Segoe UI", Arial, Helvetica, sans-serif;
  }

  .header {
    padding: 14px 16px 10px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--neutral);
    flex-shrink: 0;
  }

  .header .dot.safe { background: var(--safe); }
  .header .dot.danger { background: var(--danger); }

  .header h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    text-transform: uppercase;
    color: var(--neutral);
  }

  .body {
    padding: 16px;
  }

  .url-line {
    font-size: 12px;
    color: var(--neutral);
    word-break: break-all;
    margin-bottom: 14px;
    line-height: 1.4;
  }

  .status-card {
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid var(--line);
  }

  .status-card.safe {
    background: var(--safe-bg);
    border-color: #c5e6d3;
  }

  .status-card.danger {
    background: var(--danger-bg);
    border-color: #f3c6c1;
  }

  .status-title {
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 4px 0;
  }

  .status-card.safe .status-title { color: var(--safe); }
  .status-card.danger .status-title { color: var(--danger); }
  .status-card.neutral .status-title { color: var(--neutral); }

  .status-sub {
    font-size: 12.5px;
    color: var(--ink);
    opacity: 0.75;
    margin: 0;
    line-height: 1.4;
  }

  .prob-bar-wrap {
    margin-top: 10px;
  }

  .prob-bar-track {
    height: 6px;
    background: rgba(0,0,0,0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .prob-bar-fill {
    height: 100%;
    background: var(--danger);
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .prob-label {
    font-size: 11px;
    color: var(--neutral);
    margin-top: 4px;
  }

  .actions {
    display: flex;
    gap: 8px;
  }

  button {
    flex: 1;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    padding: 9px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
  }

  button:hover { background: #f0eee9; }

  button.primary {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }

  button.primary:hover { opacity: 0.9; }

  .footer-note {
    margin-top: 14px;
    font-size: 10.5px;
    color: var(--neutral);
    line-height: 1.4;
    text-align: center;
  }

  .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid rgba(0,0,0,0.15);
    border-top-color: var(--ink);
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    margin-right: 6px;
    vertical-align: -2px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

  <div class="header">
    <span id="headerDot" class="dot"></span>
    <h1>URL Phishing Koruması</h1>
  </div>

  <div class="body">
    <div id="urlLine" class="url-line">—</div>

    <div id="statusCard" class="status-card neutral">
      <p id="statusTitle" class="status-title">Kontrol ediliyor...</p>
      <p id="statusSub" class="status-sub">Bu sayfa için sonuç bekleniyor.</p>
      <div id="probWrap" class="prob-bar-wrap" style="display:none;">
        <div class="prob-bar-track">
          <div id="probFill" class="prob-bar-fill" style="width:0%;"></div>
        </div>
        <div id="probLabel" class="prob-label"></div>
      </div>
    </div>

    <div class="actions">
      <button id="recheckBtn">Yeniden Kontrol Et</button>
    </div>

    <div class="footer-note">
      Bu eklenti, yerel makine öğrenmesi modelinizle (localhost:5000) çalışır.
      Sunucu kapalıysa kontrol yapılamaz.
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
